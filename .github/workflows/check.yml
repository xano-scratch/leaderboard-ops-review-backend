name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      # `npm ci` whenever a lockfile is committed: package.json allows a
      # @xanots/sdk range that the lock pins, and an open install would re-render
      # xanoscript/ with whatever patch shipped most recently, failing the check
      # below on a change that touched nothing relevant. The fallback covers a
      # tree scaffolded with `--no-install`, which has no lockfile yet.
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # The gate. Typechecks, then exports under --frozen-lock, which fails
      # instead of rewriting when the committed xanoscript/ tree or xano.lock
      # disagrees with the source, naming the files that would change.
      - name: Typecheck, export, and fail on a stale xanoscript/ tree
        run: npm run xano:check

      # Backstop: the step above covers xanoscript/ and the lock. This catches
      # anything else an export writes into the working tree.
      - name: Working tree must be clean after the export
        run: git diff --exit-code
